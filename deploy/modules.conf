# Every module of the Axis Suite, one per line. deploy/install.sh reads its module's line, and
# refuses to run if two modules share a port. A new module also goes in pnpm-workspace.yaml.
#
#   port        where the module's service listens, on 127.0.0.1 only
#   local_port  its HTTPS port when the suite runs on localhost (WSL) or a bare IP address.
#               With a real domain each module gets its own subdomain on 443 instead.
#
# module    port   local_port
heimdall    3000   443
loggbok     3001   8443
yggdrasil   3002   8444
janus       3003   8445
papyrus     3004   8446
vinr        3005   8447
chronos     3006   8448
valkyrie    3007   8449
althing     3008   8450
mimir       3009   8451
