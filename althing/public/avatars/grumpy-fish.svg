<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- A grumpy fish with a drink. Drawn for Althing. -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="scales" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="url(#water)"/>
  <!-- bubbles -->
  <circle cx="30" cy="60" r="8" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.7"/>
  <circle cx="46" cy="30" r="5" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.7"/>
  <circle cx="222" cy="200" r="7" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.6"/>
  <!-- tail and fins -->
  <path d="M206 120 L250 84 L244 168 Z" fill="#a16207"/>
  <path d="M118 52 C132 22 170 24 184 50 Z" fill="#a16207"/>
  <!-- body -->
  <ellipse cx="128" cy="128" rx="92" ry="78" fill="url(#scales)"/>
  <path d="M168 96 q10 10 0 20 M184 110 q10 10 0 20 M168 136 q10 10 0 20" stroke="#a16207" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- eyes with heavy, cross brows -->
  <circle cx="82" cy="98" r="26" fill="#fff" stroke="#713f12" stroke-width="3"/>
  <circle cx="136" cy="96" r="24" fill="#fff" stroke="#713f12" stroke-width="3"/>
  <circle cx="88" cy="104" r="7" fill="#1c1917"/>
  <circle cx="140" cy="102" r="7" fill="#1c1917"/>
  <path d="M54 72 L108 86" stroke="#713f12" stroke-width="8" stroke-linecap="round"/>
  <path d="M162 70 L114 84" stroke="#713f12" stroke-width="8" stroke-linecap="round"/>
  <!-- pouting lips -->
  <path d="M74 156 C88 140 126 140 136 156 C126 170 86 170 74 156 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="3"/>
  <path d="M78 157 C96 152 116 152 132 157" stroke="#9f1239" stroke-width="3" fill="none"/>
  <!-- fin holding a glass of juice -->
  <path d="M150 170 l10 70 h40 l10 -70 Z" fill="#e0f2fe" opacity="0.55" stroke="#f8fafc" stroke-width="3"/>
  <path d="M154 196 l6 44 h40 l6 -44 Z" fill="#dc2626" opacity="0.85"/>
  <path d="M186 214 l20 -76" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
  <path d="M136 196 C142 176 166 176 170 196 C166 214 142 214 136 196 Z" fill="#ca8a04" stroke="#713f12" stroke-width="3"/>
</svg>
