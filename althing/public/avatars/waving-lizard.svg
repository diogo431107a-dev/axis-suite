  <circle cx="212" cy="120" r="5" fill="#c49a6c"/>
  <circle cx="220" cy="130" r="5" fill="#c49a6c"/>
  <path d="M176 116 a28 28 0 0 1 -6 -14 M226 112 a28 28 0 0 0 6 -14" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round"/>
